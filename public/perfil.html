<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/logo.png">
<title>Perfil · Platino Radar</title>
<style>
  :root{
    --bg:#0a1420; --bg-2:#0b1a2e;
    --panel:#122744; --panel-2:#15325a;
    --line:#265a95;
    --plata:#dbe6f2; --plata-bril:#ffffff; --plata-med:#b8cae0; --plata-sombra:#7f9bc0;
    --ink:#eef4fb; --ink-soft:#a7c0e0;
    --azul-ps:#0070d1; --azul-claro:#2b8ae8;
    --vivo:#3fd98f; --moribundo:#e8c05a; --muerto:#e8683a; --oro:#ffd97a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 560px at 50% -10%, #123a6b 0%, transparent 60%),
      linear-gradient(168deg, #0c1d33 0%, #0a1627 45%, #091628 100%);
    background-attachment:fixed;
    color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100dvh;line-height:1.5;padding:0 clamp(14px,4vw,32px);
  }
  .container{width:100%;max-width:1120px;margin:0 auto}
  @media (min-width:800px){ body{padding:0 clamp(24px,5vw,60px);font-size:1.06rem} }

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0 18px;margin-bottom:26px}
  .brand{display:flex;align-items:center;text-decoration:none;transition:opacity .15s}
  .brand:hover{opacity:.85}
  .logo-img{height:64px;width:auto;display:block}
  @media(min-width:800px){.logo-img{height:88px}}
  .nav{display:flex;align-items:center;gap:8px;flex:none}
  .btn{font-weight:700;font-size:.84rem;padding:9px 15px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap;
    font-family:inherit}
  a.btn{text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--azul-claro)}
  .btn-salir{color:var(--plata-sombra)}
  .btn-salir:hover{border-color:var(--muerto);color:var(--muerto)}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;cursor:pointer;font-family:inherit;padding:0;
    background:linear-gradient(145deg,#3a5a86,#22344d);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;color:var(--plata-bril);font-size:.9rem}
  .hidden{display:none !important}

  /* Cabecera del perfil */
  .profile{
    position:relative;overflow:hidden;
    background:
      linear-gradient(125deg, rgba(255,255,255,.13) 0%, transparent 20%, transparent 80%, rgba(255,255,255,.05) 100%),
      linear-gradient(160deg, #0a6ec9 0%, #084b9e 45%, #0a3f86 100%);
    border:1px solid #2b8ae8;border-radius:18px;
    padding:clamp(18px,4vw,28px);margin-bottom:26px;
    box-shadow:0 24px 60px -26px rgba(0,80,180,.7), 0 2px 0 rgba(255,255,255,.25) inset;
  }
  .profile::after{content:"";position:absolute;top:-50%;left:-25%;width:75%;height:200%;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:rotate(18deg)}
  .profile > *{position:relative;z-index:1}
  .profile-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .user-avatar{
    width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:2rem;font-weight:800;color:#0a3f86;
    background:linear-gradient(145deg,#e2e9f2,#aebdd4 45%,#8496b0);
    box-shadow:inset 0 2px 5px rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.4);
  }
  .user-main{flex:1;min-width:170px}
  .user-name{font-size:clamp(1.4rem,4.5vw,1.9rem);font-weight:800;color:#fff;line-height:1.1}
  .user-since{color:#c5ddf7;font-size:.82rem;margin-top:4px}
  .psn-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.75rem;
    background:rgba(4,20,45,.35);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:4px 11px;color:#d3e6ff}
  .psn-chip.ok{color:#7dffc4;border-color:rgba(125,255,196,.5)}
  .level-box{flex:none;text-align:center;background:rgba(4,20,45,.35);
    border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:14px 20px;min-width:130px}
  .plat-count{font-size:2rem;font-weight:800;line-height:1;
    background:linear-gradient(180deg,#ffffff,#c8e4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .plat-label{font-size:.68rem;color:#c5ddf7;letter-spacing:.06em;text-transform:uppercase;margin-top:5px}
  .level-name{margin-top:9px;font-size:.84rem;font-weight:700;color:var(--oro)}
  .progress{margin-top:20px}
  .progress-head{display:flex;justify-content:space-between;font-size:.75rem;color:#c5ddf7;margin-bottom:7px}
  .bar{height:9px;background:rgba(4,20,45,.5);border:1px solid rgba(255,255,255,.2);
    border-radius:99px;overflow:hidden}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,#7dffc4,#ffffff);
    border-radius:99px;transition:width .5s}

  /* Panel de vinculación con PSN */
  .psn-panel{
    background:linear-gradient(158deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:16px;
    padding:clamp(18px,4vw,24px);margin-bottom:26px;
  }
  .psn-panel h3{font-size:1rem;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:9px}
  .psn-panel .desc{color:var(--ink-soft);font-size:.88rem;margin-bottom:16px;max-width:60ch}
  .psn-paso{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-size:.9rem}
  .psn-num{
    width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:var(--azul-claro);color:#06182c;font-weight:800;font-size:.78rem;
  }
  .psn-paso div{flex:1;color:var(--ink-soft);line-height:1.5}
  .psn-codigo{
    display:block;margin:10px 0;padding:14px;border-radius:10px;text-align:center;
    background:#0a1b30;border:1px dashed var(--oro);
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.3rem;font-weight:800;
    letter-spacing:.12em;color:var(--oro);user-select:all;
  }
  .psn-nota{display:block;font-size:.8rem;color:var(--plata-sombra);
    margin-top:-4px;margin-bottom:8px;font-style:italic}
  .psn-form{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
  .psn-form input{
    flex:1;min-width:170px;background:#0a1b30;border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;color:var(--ink);font-size:.94rem;font-family:inherit;outline:none;
  }
  .psn-form input:focus{border-color:var(--azul-claro)}
  .psn-btn{
    background:linear-gradient(180deg,#0a6ec9,#084b9e);color:#fff;border:1px solid #2b8ae8;
    font-weight:700;font-size:.88rem;padding:11px 20px;border-radius:10px;cursor:pointer;
    font-family:inherit;box-shadow:0 2px 0 rgba(255,255,255,.2) inset;white-space:nowrap;
  }
  .psn-btn:hover:not(:disabled){filter:brightness(1.1)}
  .psn-btn:disabled{opacity:.6;cursor:not-allowed}
  .psn-btn.sec{background:none;border-color:var(--line);color:var(--plata-sombra);box-shadow:none}
  .psn-btn.sec:hover{border-color:var(--muerto);color:var(--muerto);filter:none}
  .psn-aviso{margin-top:14px;padding:11px 14px;border-radius:10px;font-size:.86rem;display:none}
  .psn-aviso.show{display:block}
  .psn-aviso.error{background:rgba(232,104,58,.12);border:1px solid var(--muerto);color:#ffb59c}
  .psn-aviso.ok{background:rgba(63,217,143,.12);border:1px solid var(--vivo);color:#9cffce}
  .psn-estado{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
  .psn-info{font-size:.88rem;color:var(--ink-soft)}
  .psn-info b{color:var(--vivo)}
  .verif-tag{
    display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;
    padding:2px 8px;border-radius:6px;border:1px solid currentColor;margin-left:8px;
    vertical-align:middle;color:var(--vivo);background:rgba(63,217,143,.10);
  }

  /* Expositor de platinos destacados */
  .expositor{margin-bottom:30px}
  .exp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.5vw,18px)}
  .exp-item{position:relative;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
  .exp-cover{
    position:relative;aspect-ratio:600/900;border-radius:13px;overflow:hidden;
    background:linear-gradient(145deg,#1e3a5c,#141f2b);
    border:1px solid var(--oro);
    display:grid;place-items:center;color:var(--plata-sombra);font-weight:800;
    box-shadow:0 10px 30px -14px rgba(255,217,122,.35);
    transition:transform .15s;
  }
  .exp-item:hover .exp-cover{transform:translateY(-4px)}
  .exp-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .exp-nombre{font-size:.84rem;font-weight:700;line-height:1.25}
  .exp-quitar{
    position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;
    background:rgba(6,18,38,.85);border:1px solid var(--line);color:var(--plata-sombra);
    cursor:pointer;font-family:inherit;font-size:.85rem;display:grid;place-items:center;padding:0;
  }
  .exp-quitar:hover{color:var(--muerto);border-color:var(--muerto)}
  .exp-vacio{
    aspect-ratio:600/900;border-radius:13px;border:2px dashed var(--line);
    display:grid;place-items:center;text-align:center;padding:14px;
    color:var(--plata-sombra);font-size:.78rem;line-height:1.4;
  }
  .destacar-btn{
    background:none;border:1px solid var(--line);color:var(--plata-sombra);cursor:pointer;
    font-size:1rem;padding:5px 8px;border-radius:8px;flex:none;font-family:inherit;line-height:1;
  }
  .destacar-btn:hover{color:var(--oro);border-color:var(--oro)}
  .destacar-btn.on{color:var(--oro);border-color:var(--oro);background:rgba(255,217,122,.12)}

  /* Sección de platinos */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 16px}
  .sec-title{font-size:1.1rem;font-weight:800}
  .add-btn{background:linear-gradient(180deg,#0a6ec9,#084b9e);color:#fff;border:1px solid #2b8ae8;
    font-weight:700;font-size:.84rem;padding:10px 16px;border-radius:10px;cursor:pointer;
    font-family:inherit;box-shadow:0 2px 0 rgba(255,255,255,.2) inset}
  .add-btn:hover{filter:brightness(1.1)}

  .plat-list{display:flex;flex-direction:column;gap:11px;padding-bottom:44px}
  .plat-item{display:flex;align-items:center;gap:15px;
    background:linear-gradient(158deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:14px;padding:13px 15px;
    box-shadow:0 16px 40px -32px #000}
  .mini-cover{width:48px;height:64px;border-radius:8px;flex:none;overflow:hidden;
    background:linear-gradient(145deg,#1e3a5c,#141f2b);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--plata-sombra);font-weight:800;font-size:.7rem}
  .mini-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .plat-info{flex:1;min-width:0}
  .plat-name{font-weight:700;font-size:.96rem;line-height:1.2;color:var(--ink);text-decoration:none}
  .plat-name:hover{color:var(--azul-claro)}
  .plat-sub{color:var(--vivo);font-size:.75rem;margin-top:4px;display:flex;align-items:center;gap:5px}
  .tedio-vote{flex:none;text-align:right}
  .tedio-lab{font-size:.64rem;color:var(--plata-sombra);letter-spacing:.05em;
    text-transform:uppercase;margin-bottom:5px}
  .pips{display:flex;gap:3px;justify-content:flex-end}
  .pip{width:14px;height:14px;border-radius:4px;background:#1c3a5c;transition:.1s}
  .pip.on{background:linear-gradient(180deg,#f0b46a,var(--moribundo))}
  .pip.media{background:linear-gradient(90deg,#e8c05a 50%,#1c3a5c 50%)}
  .pip.editable{cursor:pointer}
  .pip.editable:hover{transform:scale(1.18)}
  .sin-voto{font-size:.72rem;color:var(--azul-claro);font-weight:600;cursor:pointer}
  .sin-voto:hover{text-decoration:underline}
  .quitar{background:none;border:none;color:var(--plata-sombra);cursor:pointer;
    font-size:1.1rem;padding:4px 6px;flex:none;font-family:inherit;line-height:1}
  .quitar:hover{color:var(--muerto)}

  .cargando,.vacio{text-align:center;padding:44px 20px;color:var(--ink-soft)}
  .vacio p{margin-bottom:14px}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--azul-claro);
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Ventana para añadir platino */
  .modal{position:fixed;inset:0;background:rgba(4,12,24,.8);z-index:100;
    display:none;align-items:flex-start;justify-content:center;padding:60px 16px}
  .modal.show{display:flex}
  .modal-card{width:100%;max-width:460px;
    background:linear-gradient(158deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:16px;padding:22px;
    box-shadow:0 30px 70px -20px #000}
  .modal-card h2{font-size:1.1rem;margin-bottom:6px}
  .modal-card .sub{color:var(--ink-soft);font-size:.86rem;margin-bottom:16px}
  .modal-card input{width:100%;background:#0a1b30;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;color:var(--ink);font-size:.95rem;font-family:inherit;outline:none}
  .modal-card input:focus{border-color:var(--azul-claro)}
  .res-lista{margin-top:14px;max-height:280px;overflow-y:auto}
  .res-item{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 14px;border-radius:10px;cursor:pointer;font-size:.92rem}
  .res-item:hover{background:#12294a}
  .res-plat{color:var(--plata-sombra);font-size:.75rem}
  .res-ya{color:var(--vivo);font-size:.72rem}
  .cerrar{margin-top:16px;width:100%;background:transparent;border:1px solid var(--line);
    color:var(--ink-soft);padding:11px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:600}
  .cerrar:hover{border-color:var(--azul-claro);color:var(--ink)}

  footer{border-top:1px solid var(--line);padding:22px 0 32px;text-align:center;
    color:var(--plata-sombra);font-size:.74rem;line-height:1.7}
</style>
</head>
<body>
  <div class="container">
    <header>
      <a class="brand" href="/"><img src="/logo.png" alt="Platino Radar" class="logo-img"></a>
      <nav class="nav">
        <div id="logged-out"></div>
        <div id="logged-in" class="hidden"></div>
      </nav>
    </header>

    <div id="contenido">
      <div class="cargando"><div class="spinner"></div>Cargando perfil…</div>
    </div>

    <footer>Datos de jugadores en vivo desde Steam · Platino Radar<br>
      <a href="/legal.html" style="color:inherit">Aviso legal, privacidad y cookies</a></footer>
  </div>

  <!-- Ventana para añadir platino -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <h2>Añadir un platino</h2>
      <p class="sub">Busca el juego que has platinado.</p>
      <input type="text" id="buscar-juego" placeholder="Escribe el nombre del juego…" autocomplete="off">
      <div class="res-lista" id="res-lista"></div>
      <button class="cerrar" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

<script type="module">
import { pintarCabecera, usuarioActual, supabase,
         platinosDe, guardarPlatino, borrarPlatino, destacarPlatino, nivelPorPlatinos } from '/auth.js';

// Admite /perfil/pulopr (URL bonita) y /perfil.html?u=pulopr (antiguo)
const params = new URLSearchParams(window.location.search);
const rutaBonita = window.location.pathname.match(/^\/perfil\/([a-z0-9_-]+)/i);
const usuarioPedido = rutaBonita ? rutaBonita[1] : params.get('u');

let yo = null;          // usuario con sesión
let perfilMostrado = null;
let esMiPerfil = false;
let misPlatinos = [];
let catalogo = {};      // juegos disponibles, por id

const contenido = document.getElementById('contenido');

function pipsHTML(valor, editable, juegoId){
  let html = '';
  for(let i=1;i<=5;i++){
    let clase = '';
    if(valor >= i) clase = 'on';
    else if(valor >= i-0.5) clase = 'media';
    if(editable) clase += ' editable';
    const attr = editable ? ` data-juego="${juegoId}" data-valor="${i}"` : '';
    html += `<span class="pip ${clase}"${attr}></span>`;
  }
  return html;
}

function num(v){ return (v ?? 0).toString().replace('.', ','); }

async function cargarCatalogo(){
  try {
    const r = await fetch('/api/catalogo');
    const juegos = await r.json();
    juegos.forEach(j => catalogo[j.appid] = j);
  } catch(e){ console.error(e); }
}

async function pintar(){
  const nombre = perfilMostrado.nombre_usuario || 'Sin nombre';
  const inicial = nombre.charAt(0).toUpperCase();
  const total = misPlatinos.length;
  const nv = nivelPorPlatinos(total);

  const psnChip = perfilMostrado.psn_verificado
    ? `<div class="psn-chip ok">✓ Verificado · PSN: ${perfilMostrado.psn_id}</div>`
    : `<div class="psn-chip">○ Sin verificar</div>`;

  const listaHTML = total
    ? misPlatinos.map(p => {
        const j = catalogo[p.juego_id];
        const nombreJuego = j ? j.nombre : p.juego_id;
        const ini = nombreJuego.split(' ').slice(0,2).map(w => w[0]).join('');
        const voto = p.tedio_voto ? Number(p.tedio_voto) : 0;
        return `
          <div class="plat-item">
            <div class="mini-cover">
              <img src="/api/caratula/${p.juego_id}" alt="${nombreJuego}"
                   onerror="this.style.display='none';this.parentNode.insertAdjacentText('beforeend','${ini}');">
            </div>
            <div class="plat-info">
              <a class="plat-name" href="/juego/${p.juego_id}">${nombreJuego}</a>
              <div class="plat-sub">🏆 Platino conseguido${p.verificado ? '<span class="verif-tag">✓ Verificado</span>' : ''}</div>
            </div>
            <div class="tedio-vote">
              <div class="tedio-lab">${esMiPerfil ? 'Tu tedio' : 'Su tedio'}</div>
              ${voto
                ? `<div class="pips">${pipsHTML(voto, esMiPerfil, p.juego_id)}</div>
                   <div class="tedio-lab" style="margin-top:4px">${num(voto)} / 5</div>`
                : (esMiPerfil
                    ? `<div class="pips">${pipsHTML(0, true, p.juego_id)}</div>
                       <div class="sin-voto">Vota el tedio</div>`
                    : `<div class="tedio-lab">Sin votar</div>`)}
            </div>
            ${esMiPerfil ? `
              <button class="destacar-btn ${p.destacado ? 'on' : ''}" data-destacar="${p.juego_id}"
                title="${p.destacado ? 'Quitar del expositor' : 'Destacar en el expositor'}">★</button>
              ${p.verificado ? '' : `<button class="quitar" data-borrar="${p.juego_id}" title="Quitar">✕</button>`}` : ''}
          </div>`;
      }).join('')
    : `<div class="vacio">
         <p>${esMiPerfil ? 'Todavía no has registrado ningún platino.' : 'Este usuario aún no ha registrado platinos.'}</p>
         ${esMiPerfil && !perfilMostrado.psn_verificado ? '<button class="add-btn" id="btn-vacio">+ Añadir mi primer platino</button>' : ''}
       </div>`;

  // --- Panel de vinculación con PSN (solo en mi perfil) ---
  let panelPsnHTML = '';
  if(esMiPerfil){
    if(perfilMostrado.psn_verificado){
      panelPsnHTML = `
        <div class="psn-panel">
          <div class="psn-estado">
            <div>
              <h3>🎮 Cuenta de PlayStation vinculada</h3>
              <p class="psn-info">Tus platinos se importan automáticamente desde
                <b>${perfilMostrado.psn_id}</b>. No necesitas mantener ningún código
                en tu perfil de PlayStation.</p>
            </div>
            <div style="display:flex;gap:9px;flex-wrap:wrap">
              <button class="psn-btn" id="btn-sincronizar">Sincronizar ahora</button>
              <button class="psn-btn sec" id="btn-desvincular">Desvincular</button>
            </div>
          </div>
          <div class="psn-aviso" id="psn-aviso"></div>
        </div>`;
    } else {
      panelPsnHTML = `
        <div class="psn-panel">
          <h3>🎮 Vincula tu cuenta de PlayStation</h3>
          <p class="desc">Al vincularla importamos tus platinos automáticamente, tu perfil
            queda <b style="color:var(--vivo)">verificado</b> y podrás votar lo tedioso que te
            parecieron los juegos que has platinado.</p>

          <div class="psn-paso">
            <span class="psn-num">1</span>
            <div>
              Escribe tu nombre de usuario de PlayStation:
              <div class="psn-form">
                <input type="text" id="psn-nombre" placeholder="Tu ID de PSN" autocomplete="off"
                       value="${perfilMostrado.psn_id || ''}">
                <button class="psn-btn" id="btn-psn-iniciar">Continuar</button>
              </div>
            </div>
          </div>

          <div id="psn-pasos-2-3" style="display:none">
            <div class="psn-paso">
              <span class="psn-num">2</span>
              <div>
                Copia este código y pégalo en el campo <b>"Acerca de"</b> de tu perfil de
                PlayStation (puedes editarlo desde la consola o en playstation.com):
                <code class="psn-codigo" id="psn-codigo"></code>
                <span class="psn-nota">Es temporal: en cuanto verifiquemos la cuenta podrás
                borrarlo y dejar tu "Acerca de" como quieras.</span>
              </div>
            </div>
            <div class="psn-paso">
              <span class="psn-num">3</span>
              <div>
                Guarda los cambios en PlayStation y pulsa aquí para comprobarlo.
                <b>Solo lo comprobamos una vez:</b> después puedes borrar el código,
                la sincronización seguirá funcionando igual.
                <div class="psn-form">
                  <button class="psn-btn" id="btn-psn-verificar">Comprobar y vincular</button>
                </div>
              </div>
            </div>
          </div>

          <div class="psn-aviso" id="psn-aviso"></div>
        </div>`;
    }
  }

  // --- Expositor de destacados (máximo 3) ---
  const destacados = misPlatinos.filter(p => p.destacado).slice(0, 3);
  let expositorHTML = '';

  if(destacados.length || esMiPerfil){
    const tarjetas = destacados.map(p => {
      const j = catalogo[p.juego_id];
      const nombreJuego = j ? j.nombre : p.juego_id;
      const ini = nombreJuego.split(' ').slice(0,2).map(w => w[0]).join('');
      return `
        <div class="exp-item">
          <a class="exp-cover" href="/juego/${p.juego_id}">
            <img src="/api/caratula/${p.juego_id}" alt="${nombreJuego}"
                 onerror="this.style.display='none';this.parentNode.insertAdjacentText('beforeend','${ini}');">
          </a>
          ${esMiPerfil ? `<button class="exp-quitar" data-destacar="${p.juego_id}" title="Quitar del expositor">✕</button>` : ''}
          <div class="exp-nombre">${nombreJuego}</div>
        </div>`;
    });

    // Huecos vacíos solo en mi propio perfil
    if(esMiPerfil){
      for(let i = destacados.length; i < 3; i++){
        tarjetas.push(`<div class="exp-vacio">Marca con ★ un platino de tu lista para destacarlo aquí</div>`);
      }
    }

    if(destacados.length || esMiPerfil){
      expositorHTML = `
        <div class="expositor">
          <div class="sec-head">
            <div class="sec-title">${esMiPerfil ? 'Mi vitrina' : `Vitrina de ${nombre}`}</div>
            <div class="sec-sub" style="color:var(--plata-sombra);font-size:.8rem">Los 3 platinos de los que más orgulloso está</div>
          </div>
          <div class="exp-grid">${tarjetas.join('')}</div>
        </div>`;
    }
  }

  contenido.innerHTML = `
    <div class="profile">
      <div class="profile-top">
        <div class="user-avatar">${inicial}</div>
        <div class="user-main">
          <div class="user-name">${nombre}</div>
          <div class="user-since">Cazador de platinos</div>
          ${psnChip}
        </div>
        <div class="level-box">
          <div class="plat-count">${total}</div>
          <div class="plat-label">Platinos</div>
          <div class="level-name">◆ Nivel ${nv.nivel} · ${nv.nombre}</div>
        </div>
      </div>
      <div class="progress">
        <div class="progress-head">
          <span>Nivel ${nv.nivel} · ${nv.nombre}</span>
          <span>${total} / ${nv.siguiente} para el nivel ${nv.nivel + 1}</span>
        </div>
        <div class="bar"><span style="width:${nv.progreso}%"></span></div>
      </div>
    </div>

    ${panelPsnHTML}

    ${expositorHTML}

    <div class="sec-head">
      <div class="sec-title">${esMiPerfil ? 'Mis platinos' : `Platinos de ${nombre}`}</div>
      ${esMiPerfil && !perfilMostrado.psn_verificado
        ? '<button class="add-btn" id="btn-add">+ Añadir platino</button>'
        : (esMiPerfil ? '<span class="sec-sub" style="color:var(--plata-sombra);font-size:.8rem">Se importan de PlayStation</span>' : '')}
    </div>
    <div class="plat-list">${listaHTML}</div>`;

  // --- Eventos del panel de PSN ---
  if(esMiPerfil) conectarEventosPsn();

  // Eventos
  const btnAdd = document.getElementById('btn-add');
  if(btnAdd) btnAdd.onclick = abrirModal;
  const btnVacio = document.getElementById('btn-vacio');
  if(btnVacio) btnVacio.onclick = abrirModal;

  if(esMiPerfil){
    document.querySelectorAll('.pip.editable').forEach(pip => {
      pip.onclick = async () => {
        const juego = pip.dataset.juego;
        const valor = Number(pip.dataset.valor);
        await guardarPlatino(yo.id, juego, valor);
        misPlatinos = await platinosDe(yo.id);
        pintar();
      };
    });
    document.querySelectorAll('[data-destacar]').forEach(btn => {
      btn.onclick = async () => {
        const juego = btn.dataset.destacar;
        const actual = misPlatinos.find(p => p.juego_id === juego);
        const res = await destacarPlatino(yo.id, juego, !actual?.destacado);
        if(!res.ok){ alert(res.motivo); return; }
        misPlatinos = await platinosDe(yo.id);
        pintar();
      };
    });
    document.querySelectorAll('[data-borrar]').forEach(btn => {
      btn.onclick = async () => {
        if(!confirm('¿Quitar este platino de tu perfil?')) return;
        await borrarPlatino(yo.id, btn.dataset.borrar);
        misPlatinos = await platinosDe(yo.id);
        pintar();
      };
    });
  }
}

// ============================================================
//  Vinculación con PlayStation Network
// ============================================================

function avisoPsn(texto, tipo){
  const el = document.getElementById('psn-aviso');
  if(!el) return;
  el.innerHTML = texto;
  el.className = `psn-aviso show ${tipo}`;
}

/** Llama a la API con el token de sesión del usuario. */
async function apiPsn(ruta, cuerpo = {}){
  const { data: { session } } = await supabase.auth.getSession();
  const r = await fetch(ruta, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${session?.access_token || ''}`
    },
    body: JSON.stringify(cuerpo)
  });
  const datos = await r.json().catch(() => ({}));
  return { ok: r.ok, datos };
}

function conectarEventosPsn(){
  // --- Paso 1: comprobar el usuario y obtener el código ---
  const btnIniciar = document.getElementById('btn-psn-iniciar');
  if(btnIniciar){
    btnIniciar.onclick = async () => {
      const nombre = document.getElementById('psn-nombre').value.trim();
      if(!nombre) return avisoPsn('Escribe tu nombre de usuario de PlayStation.', 'error');

      btnIniciar.disabled = true;
      btnIniciar.textContent = 'Buscando…';
      avisoPsn('', '');

      const { ok, datos } = await apiPsn('/api/psn/iniciar', { psn_id: nombre });

      btnIniciar.disabled = false;
      btnIniciar.textContent = 'Continuar';

      if(!ok) return avisoPsn(datos.error || 'No se ha podido continuar.', 'error');

      document.getElementById('psn-codigo').textContent = datos.codigo;
      document.getElementById('psn-pasos-2-3').style.display = 'block';
      avisoPsn(`Cuenta encontrada: <b>${datos.psn_id}</b>. Sigue los pasos 2 y 3.`, 'ok');
    };
  }

  // --- Paso 2: comprobar el código y sincronizar ---
  const btnVerificar = document.getElementById('btn-psn-verificar');
  if(btnVerificar){
    btnVerificar.onclick = async () => {
      btnVerificar.disabled = true;
      btnVerificar.textContent = 'Comprobando…';
      avisoPsn('Comprobando tu perfil de PlayStation e importando platinos…', 'ok');

      const { ok, datos } = await apiPsn('/api/psn/verificar');

      if(!ok){
        btnVerificar.disabled = false;
        btnVerificar.textContent = 'Comprobar y vincular';
        return avisoPsn(datos.error || 'No se ha podido verificar.', 'error');
      }

      avisoPsn(`✓ <b>¡Cuenta verificada!</b> Tienes <b>${datos.total_psn}</b> platinos en PSN,
                de los cuales <b>${datos.en_catalogo}</b> están en Platino Radar.<br><br>
                🧹 <b>Ya puedes borrar el código</b> del campo "Acerca de" de tu perfil de
                PlayStation y poner lo que quieras. La sincronización seguirá funcionando.`, 'ok');

      setTimeout(() => window.location.reload(), 3000);
    };
  }

  // --- Sincronizar ---
  const btnSinc = document.getElementById('btn-sincronizar');
  if(btnSinc){
    btnSinc.onclick = async () => {
      btnSinc.disabled = true;
      btnSinc.textContent = 'Sincronizando…';

      const { ok, datos } = await apiPsn('/api/psn/sincronizar', { forzar: true });

      btnSinc.disabled = false;
      btnSinc.textContent = 'Sincronizar ahora';

      if(!ok) return avisoPsn(datos.error || 'No se ha podido sincronizar.', 'error');

      if(datos.omitido){
        return avisoPsn(`Ya se sincronizó hace poco. Podrás volver a hacerlo en
                         ${datos.proxima_en_minutos} minutos.`, 'ok');
      }

      avisoPsn(`Sincronizado: <b>${datos.en_catalogo}</b> platinos en Platino Radar
                (${datos.añadidos} nuevos, ${datos.eliminados} retirados).`, 'ok');
      misPlatinos = await platinosDe(yo.id);
      pintar();
    };
  }

  // --- Desvincular ---
  const btnDesv = document.getElementById('btn-desvincular');
  if(btnDesv){
    btnDesv.onclick = async () => {
      if(!confirm('¿Desvincular tu cuenta de PlayStation?\n\nTu perfil dejará de estar verificado y no podrás votar el tedio, pero conservarás los platinos ya verificados.')) return;

      const { ok, datos } = await apiPsn('/api/psn/desvincular');
      if(!ok) return avisoPsn(datos.error || 'No se ha podido desvincular.', 'error');
      window.location.reload();
    };
  }
}

// --- Ventana de añadir platino ---
window.cerrarModal = () => document.getElementById('modal').classList.remove('show');

function abrirModal(){
  document.getElementById('modal').classList.add('show');
  document.getElementById('buscar-juego').focus();
  buscarJuegos('');
}

let tempBusca;
document.getElementById('buscar-juego').addEventListener('input', e => {
  clearTimeout(tempBusca);
  tempBusca = setTimeout(() => buscarJuegos(e.target.value.trim()), 250);
});

async function buscarJuegos(texto){
  const lista = document.getElementById('res-lista');
  try {
    const url = texto ? `/api/buscar?q=${encodeURIComponent(texto)}` : '/api/destacados';
    const r = await fetch(url);
    const juegos = await r.json();

    if(!juegos.length){
      lista.innerHTML = '<div class="res-item" style="cursor:default">Sin resultados.</div>';
      return;
    }

    const yaTengo = new Set(misPlatinos.map(p => p.juego_id));

    lista.innerHTML = juegos.map(j => {
      const tiene = yaTengo.has(String(j.appid));
      return `
        <div class="res-item" ${tiene ? '' : `data-add="${j.appid}"`} style="${tiene ? 'cursor:default;opacity:.6' : ''}">
          <span>${j.nombre}</span>
          ${tiene ? '<span class="res-ya">✓ Ya lo tienes</span>' : `<span class="res-plat">${j.plataforma || ''}</span>`}
        </div>`;
    }).join('');

    lista.querySelectorAll('[data-add]').forEach(el => {
      el.onclick = async () => {
        await guardarPlatino(yo.id, el.dataset.add, null);
        misPlatinos = await platinosDe(yo.id);
        await cargarCatalogo();
        cerrarModal();
        pintar();
      };
    });

  } catch(e){ console.error(e); }
}

// --- Arranque ---
(async () => {
  yo = await pintarCabecera();
  await cargarCatalogo();

  if(usuarioPedido){
    // Perfil de otro usuario (o el mío por nombre)
    const { data } = await supabase
      .from('perfiles')
      .select('id, nombre_usuario, psn_id, psn_verificado')
      .ilike('nombre_usuario', usuarioPedido)
      .maybeSingle();

    if(!data){
      contenido.innerHTML = `<div class="vacio"><p>No existe ningún usuario llamado "${usuarioPedido}".</p>
        <a class="btn" href="/">← Volver al inicio</a></div>`;
      return;
    }
    perfilMostrado = data;
    esMiPerfil = yo && yo.id === data.id;
    misPlatinos = await platinosDe(data.id);

  } else {
    // Mi propio perfil
    if(!yo){ window.location.href = '/cuenta.html'; return; }
    perfilMostrado = yo;
    esMiPerfil = true;
    misPlatinos = await platinosDe(yo.id);
  }

  pintar();
})();
</script>
