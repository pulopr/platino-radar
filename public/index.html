<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<title>Platino Radar · ¿Merece la pena ese platino?</title>
<style>
  :root{
    --bg:#0a1420; --bg-2:#0b1a2e;
    --panel:#122744; --panel-2:#15325a;
    --line:#265a95;
    --plata:#dbe6f2; --plata-bril:#ffffff; --plata-med:#b8cae0; --plata-sombra:#7f9bc0;
    --ink:#eef4fb; --ink-soft:#a7c0e0;
    --azul-ps:#0070d1; --azul-vivo:#0a6ec9; --azul-claro:#2b8ae8;
    --vivo:#3fd98f; --moribundo:#e8c05a; --muerto:#e8683a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 560px at 50% -10%, #123a6b 0%, transparent 60%),
      linear-gradient(168deg, #0c1d33 0%, #0a1627 45%, #091628 100%);
    background-attachment:fixed;
    color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100dvh;line-height:1.5;
    padding:0 clamp(14px,4vw,32px);
  }
  .container{width:100%;max-width:1120px;margin:0 auto}

  header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0 18px;position:sticky;top:0;
    background:linear-gradient(180deg,#0c1d33 70%,transparent);z-index:5;
  }
  .brand{display:flex;align-items:center;min-width:0;text-decoration:none;
    transition:opacity .15s}
  .brand:hover{opacity:.85}
  .logo-img{height:64px;width:auto;display:block}
  @media(min-width:800px){.logo-img{height:88px}}
  .nav{display:flex;align-items:center;gap:8px;flex:none}
  .btn{
    font-weight:700;font-size:.84rem;padding:9px 15px;border-radius:10px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap;
  }
  .btn:hover{border-color:var(--azul-claro)}
  .avatar{
    width:38px;height:38px;border-radius:50%;flex:none;cursor:pointer;
    background:linear-gradient(145deg,#3a5a86,#22344d);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;color:var(--plata-bril);font-size:.9rem;
  }
  .hidden{display:none !important}

  .hero{text-align:center;padding:clamp(24px,6vw,52px) 0 clamp(22px,5vw,36px)}
  .hero h1{
    font-size:clamp(1.8rem,6vw,2.9rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:12px;
    background:linear-gradient(180deg,var(--plata-bril),var(--plata) 55%,var(--plata-med));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{color:var(--ink-soft);font-size:clamp(.92rem,2.5vw,1.08rem);max-width:52ch;margin:0 auto 28px}
  .search-wrap{position:relative;max-width:560px;margin:0 auto}
  .search{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:6px 6px 6px 16px;box-shadow:0 14px 40px -24px #000;
  }
  /* Desplegable de resultados */
  .resultados{
    position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:20;
    background:#0a1b30;border:1px solid #2b5a8f;border-radius:12px;overflow:hidden;
    box-shadow:0 18px 40px -12px rgba(0,0,0,.8);
    opacity:0;visibility:hidden;transform:translateY(-4px);transition:.15s;text-align:left;
  }
  .resultados.show{opacity:1;visibility:visible;transform:translateY(0)}
  .res-item{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 16px;text-decoration:none;color:var(--ink);font-size:.92rem;
  }
  .res-item+.res-item{border-top:1px solid #1c3a5c}
  .res-item:hover{background:#12294a}
  .res-nombre{font-weight:600}
  .res-plat{color:var(--plata-sombra);font-size:.76rem;white-space:nowrap}
  .res-vacio{padding:14px 16px;color:var(--plata-sombra);font-size:.88rem}
  .search:focus-within{border-color:var(--azul-claro)}
  .search svg{flex:none;opacity:.6}
  .search input{
    flex:1;background:none;border:none;outline:none;color:var(--ink);
    font-size:1rem;padding:11px 0;font-family:inherit;min-width:0;
  }
  .search input::placeholder{color:var(--plata-sombra)}
  .search .go{
    background:linear-gradient(180deg,#0a6ec9,#084b9e);color:#fff;border:1px solid #2b8ae8;font-weight:700;
    padding:11px 20px;border-radius:10px;cursor:pointer;font-size:.92rem;white-space:nowrap;
    box-shadow:0 2px 0 rgba(255,255,255,.2) inset,0 6px 16px -8px rgba(0,80,180,.6);
  }
  .search .go:hover{filter:brightness(1.1)}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 2px 18px}
  .sec-title{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
  .sec-sub{color:var(--plata-sombra);font-size:.8rem}
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2.5vw,20px);
    padding-bottom:44px;
  }
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  .game{
    cursor:pointer;text-align:left;background:none;border:none;padding:0;color:inherit;
    font-family:inherit;display:flex;flex-direction:column;gap:9px;text-decoration:none;
  }
  .cover{
    position:relative;aspect-ratio:600/900;border-radius:13px;overflow:hidden;
    background:linear-gradient(145deg,#1e3a5c,#141f2b);
    border:1px solid var(--line);
    display:grid;place-items:center;color:var(--plata-sombra);font-weight:800;
    transition:transform .15s, box-shadow .15s;
  }
  .game:hover .cover{transform:translateY(-4px);box-shadow:0 16px 30px -18px #000;border-color:var(--azul-claro)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .state-tag{
    position:absolute;top:8px;left:8px;font-size:.66rem;font-weight:800;
    padding:3px 9px;border-radius:7px;
    background:rgba(6,18,38,.82);border:1px solid currentColor;
  }
  .state-tag.vivo{color:var(--vivo)} .state-tag.moribundo{color:var(--moribundo)} .state-tag.muerto{color:var(--muerto)}
  .g-name{font-size:.9rem;font-weight:700;line-height:1.25}
  .g-meta{font-size:.74rem;color:var(--plata-sombra)}

  .cargando,.vacio{text-align:center;padding:40px 20px;color:var(--ink-soft);grid-column:1/-1}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--azul-claro);
    border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}

  footer{border-top:1px solid var(--line);padding:22px 0 32px;text-align:center;
    color:var(--plata-sombra);font-size:.74rem;line-height:1.7}

  /* Escritorio: mismo margen lateral que la ficha */
  @media (min-width:800px){
    body{padding:0 clamp(24px,5vw,60px);font-size:1.06rem}
  }
</style>
</head>
<body>
  <div class="container">

    <header>
      <a class="brand" href="/">
        <img src="/logo.png" alt="Platino Radar" class="logo-img">
      </a>
      <nav class="nav">
        <div id="logged-out">
          <button class="btn" onclick="toggle(true)">Iniciar sesión</button>
        </div>
        <div id="logged-in" class="hidden" style="display:flex;align-items:center;gap:8px">
          <button class="btn">Mi perfil</button>
          <div class="avatar" onclick="toggle(false)" title="Cerrar sesión (demo)">A</div>
        </div>
      </nav>
    </header>

    <section class="hero">
      <h1>¿Merece la pena ese platino?</h1>
      <p>Antes de meterte horas en un juego, comprueba si sigue vivo para lo online y cómo de tedioso es su platino.</p>
      <div class="search-wrap">
        <div class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7f9bc0" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
          </svg>
          <input type="text" id="buscador" placeholder="Busca un juego… (p. ej. Dark Souls)" autocomplete="off">
          <button class="go" onclick="buscar()">Buscar</button>
        </div>
        <div class="resultados" id="resultados"></div>
      </div>
    </section>

    <div class="sec-head">
      <div class="sec-title">Recomendados para platinar</div>
      <div class="sec-sub">Selección del autor</div>
    </div>
    <div class="grid" id="grid">
      <div class="cargando"><div class="spinner"></div>Cargando recomendaciones…</div>
    </div>

    <footer>
      Datos de jugadores en vivo desde Steam · Valoraciones aportadas por el autor.
    </footer>
  </div>

<script>
// --- Cargar los juegos destacados desde el servidor ---
async function cargarDestacados(){
  const grid = document.getElementById('grid');
  try {
    const r = await fetch('/api/destacados');
    if(!r.ok) throw new Error('respuesta no ok');
    const juegos = await r.json();

    if(!juegos.length){
      grid.innerHTML = '<div class="vacio">Todavía no hay juegos destacados.</div>';
      return;
    }

    grid.innerHTML = juegos.map(j => {
      const iniciales = j.nombre.split(' ').slice(0,2).map(w => w[0]).join('');
      const jugadores = j.sin_steam
        ? j.plataforma
        : (j.jugadores !== null ? `${j.jugadores.toLocaleString('es-ES')} jugando` : j.plataforma);
      return `
        <a class="game" href="/juego.html?id=${j.appid}">
          <div class="cover">
            <span class="state-tag ${j.estado}">${j.etiqueta}</span>
            <img src="/api/caratula/${j.appid}" alt="${j.nombre}"
                 onerror="this.style.display='none';this.parentNode.insertAdjacentText('beforeend','${iniciales}');">
          </div>
          <div class="g-name">${j.nombre}</div>
          <div class="g-meta">${jugadores}</div>
        </a>`;
    }).join('');

  } catch(e){
    console.error(e);
    grid.innerHTML = '<div class="vacio">No se han podido cargar las recomendaciones.</div>';
  }
}

// --- Buscador: consulta el endpoint de búsqueda y muestra resultados ---
let temporizador;

async function buscar(){
  const texto = document.getElementById('buscador').value.trim();
  const caja = document.getElementById('resultados');

  if(texto.length < 2){
    caja.classList.remove('show');
    return;
  }

  try {
    const r = await fetch(`/api/buscar?q=${encodeURIComponent(texto)}`);
    const juegos = await r.json();

    if(!juegos.length){
      caja.innerHTML = '<div class="res-vacio">Todavía no hay ficha para ese juego.</div>';
      caja.classList.add('show');
      return;
    }

    caja.innerHTML = juegos.map(j => `
      <a class="res-item" href="/juego.html?id=${j.appid}">
        <span class="res-nombre">${j.nombre}</span>
        <span class="res-plat">${j.plataforma}</span>
      </a>`).join('');
    caja.classList.add('show');

  } catch(e){
    console.error(e);
  }
}

// Buscar según se escribe, con una pequeña pausa para no saturar
const inputBuscar = document.getElementById('buscador');
inputBuscar.addEventListener('input', () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(buscar, 250);
});

// Enter: ir directo al primer resultado
inputBuscar.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    const primero = document.querySelector('.res-item');
    if(primero) window.location.href = primero.getAttribute('href');
  }
});

// Cerrar resultados al pulsar fuera
document.addEventListener('click', e => {
  const caja = document.getElementById('resultados');
  if(!caja.contains(e.target) && e.target !== inputBuscar){
    caja.classList.remove('show');
  }
});

function toggle(loggedIn){
  document.getElementById('logged-out').classList.toggle('hidden', loggedIn);
  document.getElementById('logged-in').classList.toggle('hidden', !loggedIn);
}

cargarDestacados();
</script>
</body>
</html>
