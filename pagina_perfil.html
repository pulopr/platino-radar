<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil · ¿Sigue vivo?</title>
<style>
  :root{
    --bg:#0a1420; --bg-2:#0b1a2e;
    --panel:#122744; --panel-2:#15325a;
    --line:#265a95;
    --plata:#dbe6f2; --plata-bril:#ffffff; --plata-med:#b8cae0; --plata-sombra:#7f9bc0;
    --ink:#eef4fb; --ink-soft:#a7c0e0;
    --azul-ps:#0070d1; --azul-vivo:#0a6ec9; --azul-claro:#2b8ae8;
    --vivo:#3fd98f; --moribundo:#e8c05a; --muerto:#e8683a;
    --oro:#e8c05a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1100px 560px at 50% -10%, #123a6b 0%, transparent 60%),
      linear-gradient(168deg, #0c1d33 0%, #0a1627 45%, #091628 100%);
    background-attachment:fixed;
    color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100dvh;line-height:1.5;
  }
  .container{width:100%;max-width:760px;margin:0 auto;padding:0 clamp(14px,4vw,24px)}

  /* barra mínima superior */
  .topbar{display:flex;align-items:center;gap:10px;padding:16px 0}
  .back{color:var(--ink-soft);font-size:.85rem;text-decoration:none}
  .back:hover{color:var(--ink)}

  /* Cabecera del perfil */
  .profile{
    position:relative;overflow:hidden;
    background:
      linear-gradient(125deg, rgba(255,255,255,.13) 0%, transparent 20%, transparent 80%, rgba(255,255,255,.05) 100%),
      linear-gradient(160deg, #0a6ec9 0%, #084b9e 45%, #0a3f86 100%);
    border:1px solid #2b8ae8;border-radius:18px;
    padding:clamp(18px,4vw,26px);margin-bottom:22px;
    box-shadow:0 24px 60px -26px rgba(0,80,180,.7), 0 2px 0 rgba(255,255,255,.25) inset;
  }
  .profile::after{content:"";position:absolute;top:-50%;left:-25%;width:75%;height:200%;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:rotate(18deg)}
  .profile > *{position:relative;z-index:1}
  .profile-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .user-avatar{
    width:72px;height:72px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:1.8rem;font-weight:800;color:#0a1120;
    background:linear-gradient(145deg,#e2e9f2,#aebdd4 45%,#8496b0);
    box-shadow:inset 0 2px 5px rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.4);
  }
  .user-main{flex:1;min-width:160px}
  .user-name{font-size:clamp(1.3rem,4.5vw,1.7rem);font-weight:800;letter-spacing:-.01em;color:#fff}
  .user-since{color:#c5ddf7;font-size:.8rem;margin-top:2px}

  /* Bloque de nivel/recuento a la derecha */
  .level-box{
    flex:none;text-align:center;background:rgba(4,20,45,.35);
    border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:12px 18px;min-width:120px;
  }
  .plat-count{font-size:1.9rem;font-weight:800;line-height:1;
    background:linear-gradient(180deg,#ffffff,#c8e4ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .plat-label{font-size:.68rem;color:#c5ddf7;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
  .level-name{margin-top:8px;font-size:.82rem;font-weight:700;color:#ffd97a}

  /* barra de progreso al siguiente nivel */
  .progress{margin-top:18px}
  .progress-head{display:flex;justify-content:space-between;font-size:.74rem;color:#c5ddf7;margin-bottom:6px}
  .bar{height:8px;background:rgba(4,20,45,.5);border:1px solid rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
  .bar span{display:block;height:100%;width:70%;
    background:linear-gradient(90deg,#7dffc4,#ffffff);border-radius:99px}

  /* Sección lista de platinos */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 2px 14px}
  .sec-title{font-size:1.05rem;font-weight:800}
  .add-btn{background:linear-gradient(180deg,#0a6ec9,#084b9e);color:#fff;border:1px solid #2b8ae8;font-weight:700;font-size:.82rem;
    padding:9px 15px;border-radius:10px;cursor:pointer;box-shadow:0 2px 0 rgba(255,255,255,.2) inset}

  .plat-list{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
  .plat-item{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  }
  .mini-cover{
    width:46px;height:62px;border-radius:8px;flex:none;overflow:hidden;
    background:linear-gradient(145deg,#2a3947,#141f2b);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--plata-sombra);font-weight:800;font-size:.7rem;
  }
  .mini-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .plat-info{flex:1;min-width:0}
  .plat-name{font-weight:700;font-size:.95rem;line-height:1.2}
  .plat-plat{color:var(--vivo);font-size:.74rem;margin-top:3px;display:flex;align-items:center;gap:5px}
  .trophy{font-size:.85rem}
  /* voto de tedio */
  .tedio-vote{flex:none;text-align:right}
  .tedio-lab{font-size:.64rem;color:var(--plata-sombra);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
  .pips{display:flex;gap:3px;justify-content:flex-end}
  .pip{width:13px;height:13px;border-radius:4px;background:#33455c;cursor:pointer;transition:.1s}
  .pip.on{background:linear-gradient(180deg,#f0b46a,var(--moribundo))}
  .pip:hover{transform:scale(1.15)}
  .no-vote{font-size:.72rem;color:var(--azul-ps);font-weight:600}

  footer{border-top:1px solid var(--line);padding:20px 0 30px;text-align:center;
    color:var(--plata-sombra);font-size:.72rem;line-height:1.7}
</style>
</head>
<body>
  <div class="container">

    <div class="topbar">
      <a href="#" class="back">← Volver al inicio</a>
    </div>

    <!-- CABECERA DEL PERFIL -->
    <div class="profile">
      <div class="profile-top">
        <div class="user-avatar">A</div>
        <div class="user-main">
          <div class="user-name">Alberto</div>
          <div class="user-since">Cazando platinos desde 2024</div>
        </div>
        <div class="level-box">
          <div class="plat-count">27</div>
          <div class="plat-label">Platinos</div>
          <div class="level-name">◆ Nivel 3 · Veterano</div>
        </div>
      </div>
      <div class="progress">
        <div class="progress-head">
          <span>Nivel 3 · Veterano</span>
          <span>27 / 30 para Nivel 4</span>
        </div>
        <div class="bar"><span></span></div>
      </div>
    </div>

    <!-- LISTA DE PLATINOS -->
    <div class="sec-head">
      <div class="sec-title">Mis platinos</div>
      <button class="add-btn">+ Añadir platino</button>
    </div>
    <div class="plat-list" id="list"></div>

    <footer>
      Tu voto de tedio alimenta la nota de la comunidad en cada juego.<br>
      Maqueta · datos de ejemplo.
    </footer>
  </div>

<script>
// Platinos de ejemplo. tedio = voto del usuario (0 = sin votar aún)
const PLATINOS = [
  {appid:570940, nombre:"Dark Souls Remastered", tedio:4},
  {appid:814380, nombre:"Sekiro: Shadows Die Twice", tedio:3},
  {appid:367520, nombre:"Hollow Knight", tedio:5},
  {appid:1145360,nombre:"Hades", tedio:2},
  {appid:504230, nombre:"Celeste", tedio:0},
];

function fuentes(appid){
  return [
    `https://steamcdn-a.akamaihd.net/steam/apps/${appid}/library_600x900_2x.jpg`,
    `https://steamcdn-a.akamaihd.net/steam/apps/${appid}/header.jpg`,
  ];
}

const list = document.getElementById("list");
PLATINOS.forEach(p=>{
  const src = fuentes(p.appid);
  const ini = p.nombre.split(" ").slice(0,2).map(w=>w[0]).join("");
  let pips = "";
  for(let i=1;i<=5;i++) pips += `<span class="pip ${i<=p.tedio?'on':''}"></span>`;
  const votoHTML = p.tedio>0
    ? `<div class="tedio-lab">Tu tedio</div><div class="pips">${pips}</div>`
    : `<div class="tedio-lab">Sin votar</div><div class="no-vote">Vota el tedio →</div>`;
  const item = document.createElement("div");
  item.className = "plat-item";
  item.innerHTML = `
    <div class="mini-cover">
      <img src="${src[0]}" alt="${p.nombre}" data-i="0"
        onerror="if(parseInt(this.dataset.i)<1){this.dataset.i=1;this.src='${src[1]}';}else{this.style.display='none';this.parentNode.insertAdjacentText('beforeend','${ini}');}">
    </div>
    <div class="plat-info">
      <div class="plat-name">${p.nombre}</div>
      <div class="plat-plat"><span class="trophy">🏆</span> Platino conseguido</div>
    </div>
    <div class="tedio-vote">${votoHTML}</div>`;
  list.appendChild(item);
});
</script>
</body>
</html>
